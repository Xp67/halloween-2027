# La fuga di Zucco su https://zucco.getinvolvd.com.
# Provvisorio: si appoggia a Caddy di ELEFIX come un'istanza, finché il sito GetInvolved non è online.
# Il tunnel manda già *.getinvolvd.com a Caddy, che legge l'etichetta: su Cloudflare non serve fare nulla.
name: zucco

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - classifica
    networks:
      - default
      - elefix_proxy
    labels:
      caddy: http://zucco.getinvolvd.com
      caddy.reverse_proxy: "{{upstreams 80}}"
    deploy:
      resources:
        limits:
          memory: 64m

  # Solo per la versione di prova: sul sito la classifica sarà legata al profilo.
  # Sta sulla rete privata del progetto, la raggiunge solo nginx. Il limite di CPU protegge le istanze
  # che girano sullo stesso server, perché ogni salvataggio rigioca una partita intera.
  classifica:
    build:
      context: .
      target: classifica
    restart: unless-stopped
    init: true
    volumes:
      - classifica:/dati
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  classifica:

networks:
  elefix_proxy:
    external: true
