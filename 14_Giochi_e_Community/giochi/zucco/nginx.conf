server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # I file non hanno l'hash nel nome: dopo un aggiornamento browser e Cloudflare
    # non devono mischiare moduli vecchi e nuovi.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # I file di una versione, con l'impronta nel percorso (vedi Dockerfile): non cambiano mai, possono
    # restare in cache quanto vogliono. Una versione nuova ha un percorso nuovo.
    location ~ ^/v/[0-9a-f]+/(.*)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files /$1 =404;
    }

    # La classifica di prova. Con la variabile il nome viene risolto a ogni richiesta:
    # il container può ripartire con un altro indirizzo senza riavviare nginx.
    location = /api/classifica {
        resolver 127.0.0.11 valid=10s;
        set $classifica http://classifica:8080;
        proxy_pass $classifica;
        client_max_body_size 256k;
    }
}
