server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le pagine e gli sfondi non vanno mai in cache: sono le pagine a portare l'impronta della versione.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Script e stile si chiedono sempre con ?v=<impronta> (vedi Dockerfile): a quell'indirizzo non cambiano mai.
    location ~ \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
